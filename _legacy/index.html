<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reveal — physics-fountain image reveal</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    background: #05060a; color: #e8eaf0;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
    font-size: 12px;
    -webkit-font-smoothing: antialiased;
  }
  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.08); border-radius: 4px; }

  #sim { position: fixed; inset: 0; display: block; }

  /* ── Visual hole editor (SVG overlay) ─────────────────────────────── */
  #editor {
    position: fixed; inset: 0; z-index: 5;
    pointer-events: none;
  }
  #editor .container-outline {
    fill: none;
    stroke: rgba(255,255,255,0.10);
    stroke-width: 1;
    stroke-dasharray: 4 5;
  }
  #editor .edge-hit {
    fill: none;
    stroke: transparent;
    stroke-width: 26;
    pointer-events: stroke;
    cursor: copy;
  }
  #editor .edge-hit:hover { stroke: rgba(107,216,255,0.06); }
  #editor .hole-group {
    pointer-events: auto;
    cursor: grab;
  }
  #editor .hole-group.dragging { cursor: grabbing; }
  #editor .hole-band {
    fill: rgba(107,216,255,0.28);
    stroke: rgba(107,216,255,0.85);
    stroke-width: 1.5;
    transition: fill 0.12s ease;
  }
  #editor .hole-group:hover .hole-band { fill: rgba(107,216,255,0.42); }
  #editor .hole-group.selected .hole-band {
    fill: rgba(255,200,80,0.32);
    stroke: rgba(255,200,80,1);
  }
  #editor .hole-arrow {
    stroke: rgba(107,216,255,1);
    stroke-width: 2;
    fill: none;
    stroke-linecap: round;
    pointer-events: none;
  }
  #editor .hole-group.selected .hole-arrow { stroke: rgba(255,200,80,1); }
  #editor .hole-arrowhead {
    fill: rgba(107,216,255,1);
    pointer-events: none;
  }
  #editor .hole-group.selected .hole-arrowhead { fill: rgba(255,200,80,1); }
  #editor .hole-rotator {
    fill: rgba(20,24,32,1);
    stroke: rgba(107,216,255,1);
    stroke-width: 1.5;
    cursor: ew-resize;
    pointer-events: auto;
  }
  #editor .hole-group.selected .hole-rotator { stroke: rgba(255,200,80,1); }
  #editor .grid-hint {
    fill: rgba(107,216,255,0.5);
    pointer-events: none;
  }

  /* ── Floating tuning panel ────────────────────────────────────────── */
  #panel {
    position: fixed; top: 14px; left: 14px; z-index: 10;
    width: 296px;
    background: rgba(8,10,18,0.78);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border: 1px solid rgba(255,255,255,0.10);
    border-radius: 12px;
    padding: 14px 14px 16px;
    color: #e8eaf0;
    user-select: none;
    max-height: calc(100vh - 28px);
    overflow-y: auto;
  }
  #panel h3 {
    font-size: 12px; font-weight: 600;
    letter-spacing: -0.01em; opacity: 0.95;
    margin-bottom: 10px;
    display: flex; align-items: center; gap: 8px;
  }
  #panel h3::before {
    content: "";
    width: 8px; height: 8px; border-radius: 50%;
    background: linear-gradient(135deg, #6bd8ff, #c49bff);
  }
  #panel .row {
    display: grid;
    grid-template-columns: 84px 1fr 38px;
    align-items: center; gap: 9px;
    margin-bottom: 5px;
  }
  #panel label { opacity: 0.72; font-size: 11px; }
  #panel input[type="range"] {
    width: 100%; height: 14px;
    accent-color: #6bd8ff;
    background: transparent;
  }
  #panel .v {
    text-align: right; opacity: 0.95;
    font-variant-numeric: tabular-nums;
    font-size: 11px;
  }
  #panel .info {
    margin-top: 12px; padding-top: 10px;
    border-top: 1px solid rgba(255,255,255,0.08);
    opacity: 0.7; font-size: 11px;
    font-variant-numeric: tabular-nums;
    display: flex; justify-content: space-between;
  }
  #panel .info b { color: #fff; font-weight: 500; }
  #panel .group-label {
    font-size: 9px; font-weight: 600;
    opacity: 0.45; letter-spacing: 0.10em; text-transform: uppercase;
    margin-top: 14px; margin-bottom: 6px;
    display: flex; align-items: center; justify-content: space-between;
  }
  #panel .group-label:first-of-type { margin-top: 4px; }

  #panel .mini-btn {
    padding: 1px 8px;
    font-size: 10px; font-weight: 500; letter-spacing: 0.02em;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.16);
    border-radius: 4px;
    color: #fff; cursor: pointer;
    text-transform: none;
    opacity: 1;
    font-family: inherit;
  }
  #panel .mini-btn:hover { background: rgba(255,255,255,0.16); }

  /* ── Image picker ─────────────────────────────────────────────────── */
  .image-picker {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 5px;
  }
  .img-btn {
    aspect-ratio: 1;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.10);
    border-radius: 7px;
    color: #fff;
    cursor: pointer;
    font: inherit;
    font-size: 18px;
    padding: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.12s ease, border-color 0.12s ease, transform 0.12s ease;
  }
  .img-btn:hover {
    background: rgba(255,255,255,0.10);
    border-color: rgba(255,255,255,0.18);
  }
  .img-btn:active { transform: scale(0.97); }
  .img-btn.selected {
    border-color: rgba(107,216,255,0.65);
    background: rgba(107,216,255,0.10);
  }
  .img-btn[data-sample="reveal"] {
    font-size: 12px; font-weight: 800; letter-spacing: 0.02em;
  }

  /* ── Hole rows (panel) ────────────────────────────────────────────── */
  .hole-row {
    display: grid;
    grid-template-columns: 56px 1fr 38px 38px 18px;
    gap: 5px;
    align-items: center;
    margin-bottom: 4px;
    padding: 3px 4px;
    border-radius: 5px;
    cursor: pointer;
  }
  .hole-row:hover { background: rgba(255,255,255,0.03); }
  .hole-row.selected { background: rgba(107,216,255,0.06); }
  .hole-row select,
  .hole-row input[type="number"] {
    background: rgba(255,255,255,0.06);
    color: #fff;
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 3px;
    font-size: 10px;
    padding: 2px 3px;
    font-family: inherit;
    width: 100%;
  }
  .hole-row input[type="number"] {
    font-variant-numeric: tabular-nums;
    -moz-appearance: textfield;
  }
  .hole-row input[type="number"]::-webkit-inner-spin-button,
  .hole-row input[type="number"]::-webkit-outer-spin-button {
    -webkit-appearance: none; margin: 0;
  }
  .hole-row input[type="range"] {
    height: 12px; width: 100%;
    accent-color: #6bd8ff;
  }
  .hole-row .remove-btn {
    width: 18px; height: 18px;
    padding: 0; line-height: 1;
    font-size: 14px;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 3px;
    color: rgba(255,255,255,0.6);
    cursor: pointer;
  }
  .hole-row .remove-btn:hover {
    color: #ff8a8a; background: rgba(255,80,80,0.12);
  }

  /* ── HUD + controls ───────────────────────────────────────────────── */
  #hud {
    position: fixed; left: 16px; bottom: 14px; z-index: 4;
    font-size: 11px; opacity: 0.55; user-select: none;
    font-variant-numeric: tabular-nums;
    letter-spacing: 0.04em;
    pointer-events: none;
  }
  #hud b { color: #fff; font-weight: 500; }

  #controls {
    position: fixed; right: 16px; bottom: 14px; z-index: 4;
    display: flex; gap: 8px;
  }
  button.action {
    padding: 9px 14px;
    background: rgba(255,255,255,0.06);
    color: #fff;
    border: 1px solid rgba(255,255,255,0.18);
    border-radius: 8px;
    cursor: pointer;
    font: inherit; font-size: 12px;
    backdrop-filter: blur(8px);
    transition: background 0.15s ease;
  }
  button.action:hover { background: rgba(255,255,255,0.14); }
  button.action.primary {
    background: rgba(107,216,255,0.18);
    border-color: rgba(107,216,255,0.45);
  }
  button.action.primary:hover { background: rgba(107,216,255,0.28); }

  /* tooltip-ish hints for the editor */
  #editor-hint {
    position: fixed; left: 50%; top: 14px; transform: translateX(-50%);
    padding: 6px 12px; z-index: 4;
    font-size: 11px; opacity: 0;
    background: rgba(8,10,18,0.78);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,0.10);
    border-radius: 6px;
    pointer-events: none;
    transition: opacity 0.15s ease;
  }
  #editor-hint.visible { opacity: 0.85; }
</style>
</head>
<body>

<canvas id="sim"></canvas>

<svg id="editor"></svg>

<div id="editor-hint"></div>

<div id="panel">
  <h3>Reveal</h3>

  <div class="group-label"><span>Image</span></div>
  <div class="image-picker">
    <button class="img-btn" data-sample="reveal" title="REVEAL text">A</button>
    <button class="img-btn" data-sample="heart" title="Heart">❤️</button>
    <button class="img-btn" data-sample="star" title="Star">⭐</button>
    <button class="img-btn" data-sample="rocket" title="Rocket">🚀</button>
    <label class="img-btn" title="Upload image">
      <input type="file" accept="image/*" id="img-upload">↑
    </label>
  </div>

  <div class="group-label">Fountain</div>
  <div class="row">
    <label for="s_bpf">balls/frame</label>
    <input id="s_bpf" type="range" min="1" max="300" value="5" step="1">
    <span class="v" id="s_bpf_v">5</span>
  </div>
  <div class="row">
    <label for="s_spawn">spawn frames</label>
    <input id="s_spawn" type="range" min="40" max="2000" value="260" step="10">
    <span class="v" id="s_spawn_v">260</span>
  </div>
  <div class="row">
    <label for="s_settle">settle frames</label>
    <input id="s_settle" type="range" min="40" max="600" value="200" step="10">
    <span class="v" id="s_settle_v">200</span>
  </div>
  <div class="row">
    <label for="s_speed">launch speed</label>
    <input id="s_speed" type="range" min="4" max="40" value="20" step="1">
    <span class="v" id="s_speed_v">20</span>
  </div>
  <div class="row">
    <label for="s_cone">launch cone</label>
    <input id="s_cone" type="range" min="0" max="2" value="0.85" step="0.05">
    <span class="v" id="s_cone_v">0.85</span>
  </div>

  <div class="group-label">Balls</div>
  <div class="row">
    <label for="s_radius">radius</label>
    <input id="s_radius" type="range" min="1" max="14" value="6" step="1">
    <span class="v" id="s_radius_v">6</span>
  </div>
  <div class="row">
    <label for="s_rest">restitution</label>
    <input id="s_rest" type="range" min="0" max="1" value="0.05" step="0.02">
    <span class="v" id="s_rest_v">0.05</span>
  </div>
  <div class="row">
    <label for="s_friction">friction</label>
    <input id="s_friction" type="range" min="0" max="0.4" value="0.12" step="0.01">
    <span class="v" id="s_friction_v">0.12</span>
  </div>

  <div class="group-label">
    <span>Holes</span>
    <button id="add-hole" class="mini-btn">+ add</button>
  </div>
  <div id="holes-list"></div>

  <div class="group-label">World</div>
  <div class="row">
    <label for="s_gravity">gravity</label>
    <input id="s_gravity" type="range" min="0.1" max="2.5" value="1.0" step="0.05">
    <span class="v" id="s_gravity_v">1.00</span>
  </div>

  <div class="info">
    <span>total balls</span>
    <b id="s_total">1,300</b>
  </div>
</div>

<div id="hud">
  seed <b id="seedVal">—</b> &nbsp;·&nbsp; <b id="particleCount">0</b> particles &nbsp;·&nbsp; <b id="phase">booting</b>
</div>

<div id="controls">
  <button id="replay" class="action primary">Replay</button>
  <button id="reseed" class="action">New seed</button>
</div>

<script type="module" src="./main.js"></script>
</body>
</html>
